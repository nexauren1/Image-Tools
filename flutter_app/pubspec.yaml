name: imagetools
description: Image Tools — professional on-device image editor.
publish_to: none
version: 2.0.0+45

environment:
  sdk: ">=3.12.0 <4.0.0"
  flutter: ">=3.44.0"

dependencies:
  flutter:
    sdk: flutter
  material_ui: ^1.11.1
  cupertino_icons: ^1.0.8
  image: ^4.13.1
  image_picker: ^1.2.4
  cross_file: ^0.3.4+2
  google_mlkit_subject_segmentation: ^0.3.2
  google_mlkit_text_recognition: ^1.0.3
  google_mlkit_face_detection: ^1.0.3
  share_plus: ^13.3.1
  path_provider: ^2.1.5
  shared_preferences: ^2.5.6
  firebase_core: ^5.2.0
  firebase_auth: ^7.1.0
  cloud_firestore: ^7.2.0
  google_sign_in: ^7.2.0
  http: ^1.6.0
  url_launcher: ^6.3.3
  app_links: ^7.2.2
  pdf: ^3.13.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
