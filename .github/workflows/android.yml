name: Android Build
on:
  push:
    branches: ["main", "v*"]
  workflow_dispatch:
    inputs:
      release:
        description: Create GitHub release after a successful build
        required: false
        default: "false"
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-37" "build-tools;37.0.1"
      - name: Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.5.0"
      - name: Build
        run: gradle assembleDebug --no-daemon --stacktrace
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: image-tools-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
      - name: Release
        if: startsWith(github.ref, 'refs/heads/v') || (github.event_name == 'workflow_dispatch' && inputs.release == 'true')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Image Tools ${{ github.ref_name }}
          generate_release_notes: true
          files: app/build/outputs/apk/debug/app-debug.apk