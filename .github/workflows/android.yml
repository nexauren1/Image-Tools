name: Android Build
on:
  push:
    branches: ["main", "v*"]
  workflow_dispatch:
    inputs:
      release:
        description: Create GitHub release after a successful build
        required: false
        default: "false"
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
      - name: Install Android SDK packages
        run: |
          sdkmanager --channel=3 "platforms;android-37.0" "build-tools;37.0.0"
          if [ -d "$ANDROID_HOME/platforms/android-37.0" ] && [ ! -e "$ANDROID_HOME/platforms/android-37" ]; then
            ln -s "android-37.0" "$ANDROID_HOME/platforms/android-37"
          fi
      - name: Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.5.0"
      - name: Build optimized APK + AAB
        run: gradle assembleDebug assembleRelease bundleRelease --no-daemon --stacktrace
      - name: Upload installable optimized debug APK
        uses: actions/upload-artifact@v4
        with:
          name: image-tools-optimized-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
      - name: Upload optimized release APK
        uses: actions/upload-artifact@v4
        with:
          name: image-tools-release-apk
          path: app/build/outputs/apk/release/app-release.apk
      - name: Upload Play-ready AAB
        uses: actions/upload-artifact@v4
        with:
          name: image-tools-release-aab
          path: app/build/outputs/bundle/release/app-release.aab
      - name: Release
        if: startsWith(github.ref, 'refs/heads/v') || (github.event_name == 'workflow_dispatch' && inputs.release == 'true')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Image Tools ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            app/build/outputs/apk/debug/app-debug.apk
            app/build/outputs/apk/release/app-release.apk
            app/build/outputs/bundle/release/app-release.aab
