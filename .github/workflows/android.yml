name: Android Build
on:
  push:
    branches: ["main"]
  workflow_dispatch:
    inputs:
      release:
        description: Create GitHub release after a successful build
        required: false
        default: "false"
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.6.0"
      - name: Build
        env:
          WORKER_URL: ${{ vars.WORKER_URL }}
          GOOGLE_WEB_CLIENT_ID: ${{ vars.GOOGLE_WEB_CLIENT_ID }}
        run: |
          echo "WORKER_URL=$WORKER_URL" >> gradle.properties
          echo "GOOGLE_WEB_CLIENT_ID=$GOOGLE_WEB_CLIENT_ID" >> gradle.properties
          gradle assembleDebug --no-daemon
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: image-tools-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
      - name: Release
        if: github.event_name == 'workflow_dispatch' && inputs.release == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}-debug
          name: Image Tools v${{ github.run_number }} Preview
          generate_release_notes: true
          files: app/build/outputs/apk/debug/app-debug.apk